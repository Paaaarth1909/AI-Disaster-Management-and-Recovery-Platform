<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer Dark Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect width="64" height="64" rx="16" stroke="#1e293b" stroke-width="2" />
  
  <!-- Radar concentric circles -->
  <circle cx="32" cy="32" r="24" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6" />
  <circle cx="32" cy="32" r="16" stroke="#3b82f6" stroke-width="1.5" opacity="0.4" />
  
  <!-- Tactical Shield -->
  <path d="M32 12L46 17V30C46 41 38 49 32 52C26 49 18 41 18 30V17L32 12Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#glowGrad)" 
        stroke-width="2" 
        stroke-linejoin="round" />
        
  <!-- Beacon pulse center dot & wave -->
  <circle cx="32" cy="30" r="4.5" fill="#ffffff" />
  <path d="M28 26L32 30L36 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 34L32 30L38 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

